name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  types:
    name: Static types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: mypy (strict)
        run: mypy

  test:
    name: Tests ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest --cov-report=xml --cov-report=term --cov-fail-under=85
      - name: Smoke-test the command line interface
        run: |
          python -m agroclim --version
          python -m agroclim features examples/sample_season.csv
          python -m agroclim recommend --crop wheat --precipitation 139 --humidity 55 --json
      - name: Publish the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the build tooling
        run: python -m pip install build twine
      - name: Build the wheel and the sdist
        run: python -m build
      - name: Check the metadata
        run: twine check dist/*
      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, types, test, build]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "At least one CI job did not pass." >&2
            exit 1
          fi
          echo "All CI jobs passed." >> "$GITHUB_STEP_SUMMARY"
