name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the build tooling
        run: python -m pip install build twine
      - name: Build the wheel and the sdist
        run: python -m build
      - name: Check the metadata
        run: twine check dist/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "agroclim ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --verify-tag
      # Publishing to PyPI is the next step: add a trusted publisher for this
      # repository and append a `pypa/gh-action-pypi-publish` step here.
