[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agroclim"
version = "0.1.0"
description = "Planting-date decision support for rainfed crops in Northern Kazakhstan"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mukan Idrissov" }]
keywords = ["agriculture", "agronomy", "kazakhstan", "planting date", "research software"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.1",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Choppa2077/agroclim-kz"
Repository = "https://github.com/Choppa2077/agroclim-kz"
Issues = "https://github.com/Choppa2077/agroclim-kz/issues"

[project.scripts]
agroclim = "agroclim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agroclim"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --doctest-modules --cov=agroclim --cov-report=term-missing"
testpaths = ["tests", "src"]

[tool.coverage.run]
branch = true
source = ["agroclim"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise AssertionError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # typographic characters are intentional in docs

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.10"
files = ["src/agroclim"]
strict = true
warn_unused_configs = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true
